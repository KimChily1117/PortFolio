buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:4.2.2' }
}
allprojects {
    repositories { google(); mavenCentral() }
    if (rootProject.hasProperty('asterBuildRoot') && name != 'app') {
        buildDir = new File(rootProject.property('asterBuildRoot'), name)
    }
}
