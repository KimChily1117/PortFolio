syntax = "proto3";

package protocol;
option csharp_namespace = "Server.Protocol";

enum MsgId {
  MSG_ID_NONE = 0;

  C_PING = 1001;
  S_PONG = 1002;

  C_MOVE_INPUT = 2001;
  S_ROOM_SNAPSHOT = 2002;

  C_ACTION_INPUT = 2003;
  S_COMBAT_EVENTS = 2004;
  S_PATTERN_ZONES = 2005;
}

message C_Ping {
  uint32 sequence = 1;
  string message = 2;
}

message S_Pong {
  uint32 sequence = 1;
  string message = 2;
}