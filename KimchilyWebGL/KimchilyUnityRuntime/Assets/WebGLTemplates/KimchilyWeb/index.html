<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b121d">
  <title>Kimchily · World</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main id="player">
    <canvas id="unity-canvas" tabindex="0" aria-label="Kimchily 월드"></canvas>
    <header class="toolbar">
      <a class="brand" href="/" aria-label="Kimchily 시작 화면">KIMCHILY<span>WORLD</span></a>
      <div class="toolbar-actions">
        <button id="fullscreen" class="quiet" hidden>전체 화면</button>
        <button id="close" class="quiet" hidden>나가기</button>
      </div>
    </header>
    <section id="panel" class="panel" aria-labelledby="title">
      <div class="panel-inner">
        <span class="eyebrow">A WORLD AWAY</span>
        <h1 id="title">새로운 공간으로.</h1>
        <p id="world-label"></p>
        <p id="status" role="status" aria-live="polite">월드를 시작할 준비가 되었습니다.</p>
        <progress id="progress" max="1" value="0" hidden aria-label="로딩 진행률"></progress>
        <button id="start" class="primary">월드 시작</button>
        <button id="reload" class="primary" hidden>페이지 다시 열기</button>
        <p class="hint">왼쪽 스틱으로 이동 · 오른쪽 드래그로 시점 이동<br>PC에서는 WASD / 방향키 · 점프는 Space</p>
      </div>
    </section>
    <noscript>이 월드를 실행하려면 JavaScript를 허용해 주세요.</noscript>
  </main>
  <script>
    window.KimchilyUnityConfig = {
      loaderUrl: "Build/{{{ LOADER_FILENAME }}}",
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Kimchily",
      productName: "Kimchily Web Worlds",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
  </script>
  <script src="host.js"></script>
  <script src="player.js"></script>
</body>
</html>
